pluginManagement {
    repositories {
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

// 1.0.0 or newer is required: older releases reference JvmVendorSpec.IBM_SEMERU,
// which no longer exists in Gradle 9.6.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'greatchasms'
